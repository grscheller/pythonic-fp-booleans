[build-system]
requires = ["flit_core>=3.12,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "pythonic-fp-booleans"
version = "4.1.0"
readme = "README.md"
requires-python = ">=3.13"
authors = [
  { name = "Geoffrey R. Scheller", email = "geoffrey@scheller.com" },
]
keywords = [
  "booleans",
  "subtypable",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "pythonic-fp-gadgets>=4.0.2",
]
description = "True Booleans which are subtypable."

[project.urls]
Changelog = "https://github.com/grscheller/pythonic-fp-booleans/blob/main/CHANGELOG.md"
Documentation ="https://grscheller.github.io/pythonic-fp-booleans/release/html/"
Homepage = "https://grscheller.github.io/pythonic-fp/"
Source = "https://github.com/grscheller/pythonic-fp-booleans"

[dependency-groups]
docs = [
  "furo>=2025.12.19",
  "sphinx>=9.1",
]
pub = [
  "flit",
]
test = [
  "pytest>=8.4.1",
]

[tool.flit.module]
name = "pythonic_fp.booleans"

[tool.flit.sdist]
exclude = [
  "docs/",
  "tests/",
]

[tool.mypy]
explicit_package_bases = true
local_partial_types = true
namespace_packages = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest]
addopts = ["-ra"]
consider_namespace_packages = true
testpaths = ["tests/"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
ignore = ["RUF022", "E741"]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "E731",
  "C901",
]

[tool.ruff.format]
quote-style = "single"
docstring-code-line-length = 72
